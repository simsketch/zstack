# classes.conf: maps changed paths and PR labels to a PR class.
# Copy to .git/zstack/classes.conf with `scripts/classify.sh --init`.
#
# Format, one rule per line:
#   <glob> -> <class>          glob matched against repo-relative paths; ** spans directories
#   label:<name> -> <class>    PR label
# Classes, least to most risky: docs < tests < small-ui < feature < solo
# The riskiest class of any changed file or label wins. A file no rule matches counts as feature.
# Lines starting with # are comments.

# zstack defaults: keep
docs/** -> docs
*.md -> docs
**/test/** -> tests
**/tests/** -> tests
**/*.test.* -> tests
**/*_test.* -> tests
**/migrations/** -> solo
**/migrate/** -> solo
.github/workflows/** -> solo
**/*.tf -> solo
**/infra/** -> solo
**/auth/** -> solo
**/security/** -> solo
**/payments/** -> solo
**/billing/** -> solo
label:security -> solo
label:hold -> solo

# Your rules (add below; removing a default above is a deliberate hand edit)
# src/components/** -> small-ui
# src/styles/** -> small-ui
